ui.base.url=https://opensource-demo.orangehrmlive.com/web/index.php/auth/login
api.base.url=https://opensource-demo.orangehrmlive.com
browser=chrome
headless=true
# Enabled so a reviewer can clone and run the suite with no extra setup.
execute.live=true
video.enabled=true
artifacts.dir=artifacts
api.auth.path=/web/index.php/auth/validate
api.employee.path=/web/index.php/api/v2/pim/employees

# These are NOT secrets. OrangeHRM publishes them on the public demo login page
# at https://opensource-demo.orangehrmlive.com/ for anyone to use.
# Any real environment overrides them via ADMIN_USERNAME / ADMIN_PASSWORD, which
# take precedence over this file (see FrameworkConfig.value).
admin.username=Admin
admin.password=admin123

# The public demo does not ship a restricted (ESS) account, so when these are blank the
# role-based test provisions its own employee + ESS user through the UI and removes both
# during teardown. Set ESS_USERNAME / ESS_PASSWORD to reuse a pre-existing account on a
# real tenant instead, which skips the provisioning and teardown steps.
ess.username=
ess.password=